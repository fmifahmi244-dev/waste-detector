<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>ONNX Diagnostic — PilahAI</title>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/ort.min.js"></script>
  <style>
    body { font-family: monospace; background: #0a0f1e; color: #e0e8ff; padding: 2rem; line-height: 1.7; }
    h1 { color: #a78bfa; margin-bottom: 1.5rem; }
    h2 { color: #38bdf8; margin-top: 2rem; border-bottom: 1px solid #334; padding-bottom: .3rem; }
    .ok   { color: #22c55e; }
    .warn { color: #f97316; }
    .err  { color: #ef4444; }
    .info { color: #94a3b8; }
    pre { background: #111827; padding: 1rem; border-radius: 8px; overflow-x: auto; font-size: .85rem; }
    #log { white-space: pre-wrap; }
    button { margin-top: 1rem; padding: .6rem 1.4rem; background: #6366f1; color: #fff;
             border: none; border-radius: 8px; cursor: pointer; font-size: .95rem; }
    button:hover { background: #4f46e5; }
    label { display: block; margin-top: 1rem; color: #94a3b8; }
    input[type=file] { margin-top: .4rem; color: #e0e8ff; }
  </style>
</head>
<body>
<h1>🔬 PilahAI — ONNX Model Diagnostic</h1>
<p class="info">Halaman ini menginspeksi <code>best.onnx</code> secara langsung di browser dan mendeteksi masalah integrasi.</p>

<button id="runBtn">▶ Jalankan Diagnosis</button>
<label>
  (Opsional) Upload gambar untuk tes nyata:
  <input type="file" id="imgInput" accept="image/*" />
</label>

<h2>Log Diagnosis</h2>
<pre id="log"><span class="info">Klik tombol di atas untuk mulai...</span></pre>

<script>
const MODEL_URL  = '/best.onnx';
const IMG_SIZE   = 224;
const CLASS_LABELS_CURRENT = ['anorganik', 'organik', 'residu']; // urutan di kode saat ini

const log = document.getElementById('log');
function write(msg, cls = '') {
  const span = document.createElement('span');
  if (cls) span.className = cls;
  span.textContent = msg + '\n';
  log.appendChild(span);
}

function softmax(arr) {
  const max  = Math.max(...arr);
  const exps = arr.map(x => Math.exp(x - max));
  const sum  = exps.reduce((a, b) => a + b, 0);
  return exps.map(e => e / sum);
}

function makeTensorFromPixels(pixels, normalize) {
  const total = IMG_SIZE * IMG_SIZE;
  const buf   = new Float32Array(3 * total);
  const mean  = [0.485, 0.456, 0.406];
  const std   = [0.229, 0.224, 0.225];

  for (let i = 0; i < total; i++) {
    const r = pixels[i*4]   / 255;
    const g = pixels[i*4+1] / 255;
    const b = pixels[i*4+2] / 255;
    if (normalize) {
      buf[0*total+i] = (r - mean[0]) / std[0];
      buf[1*total+i] = (g - mean[1]) / std[1];
      buf[2*total+i] = (b - mean[2]) / std[2];
    } else {
      buf[0*total+i] = r;
      buf[1*total+i] = g;
      buf[2*total+i] = b;
    }
  }
  return buf;
}

async function getPixels(imgEl) {
  const c = new OffscreenCanvas(IMG_SIZE, IMG_SIZE);
  const ctx = c.getContext('2d');
  ctx.drawImage(imgEl, 0, 0, IMG_SIZE, IMG_SIZE);
  return ctx.getImageData(0, 0, IMG_SIZE, IMG_SIZE).data;
}

async function runDiag() {
  log.innerHTML = '';
  write('═══════════════════════════════════════════', 'info');
  write('  STEP 1 — Load Model Metadata', 'info');
  write('═══════════════════════════════════════════', 'info');

  let session;
  try {
    ort.env.wasm.numThreads = 1;
    session = await ort.InferenceSession.create(MODEL_URL, { executionProviders: ['wasm'] });
    write('✓ Model loaded successfully', 'ok');
  } catch (e) {
    write('✗ Gagal load model: ' + e.message, 'err');
    return;
  }

  // --- Input metadata ---
  write('\n--- Input ---');
  const inputNames = session.inputNames;
  write('  Input names  : ' + JSON.stringify(inputNames));
  for (const name of inputNames) {
    const meta = session.inputMetadata?.[name];
    if (meta) write(`  [${name}] type=${meta.type}  shape=${JSON.stringify(meta.dimensions)}`);
  }
  if (!inputNames.includes('images')) {
    write('⚠ Input name bukan "images"! Kode saat ini pakai "images" → MISMATCH', 'warn');
  } else {
    write('✓ Input name "images" sesuai', 'ok');
  }

  // --- Output metadata ---
  write('\n--- Output ---');
  const outputNames = session.outputNames;
  write('  Output names : ' + JSON.stringify(outputNames));
  for (const name of outputNames) {
    const meta = session.outputMetadata?.[name];
    if (meta) write(`  [${name}] type=${meta.type}  shape=${JSON.stringify(meta.dimensions)}`);
  }
  if (!outputNames.includes('output0')) {
    write('⚠ Output name bukan "output0"! Kode saat ini pakai "output0" → MISMATCH', 'warn');
  } else {
    write('✓ Output name "output0" sesuai', 'ok');
  }

  // --- STEP 2: Test dengan blank input (semua 0) ---
  write('\n\n═══════════════════════════════════════════', 'info');
  write('  STEP 2 — Inference dengan Blank Input (semua pixel = 0)', 'info');
  write('═══════════════════════════════════════════', 'info');

  const blankBuf = new Float32Array(3 * IMG_SIZE * IMG_SIZE).fill(0);
  const blankTensor = new ort.Tensor('float32', blankBuf, [1, 3, IMG_SIZE, IMG_SIZE]);
  try {
    const out = await session.run({ images: blankTensor });
    const raw = Array.from(out['output0'].data);
    const sum = raw.reduce((a,b) => a+b, 0);
    write(`  Raw output    : ${raw.map(x => x.toFixed(4)).join(', ')}`);
    write(`  Sum of output : ${sum.toFixed(6)}`);
    if (Math.abs(sum - 1.0) < 0.01) {
      write('⚠ Output SUDAH sum ke ~1.0 → model sudah apply softmax internal!', 'warn');
      write('  Jika kode juga apply softmax → DOUBLE SOFTMAX (bug!)', 'err');
    } else {
      write('✓ Output adalah raw logits (belum softmax) → perlu apply softmax di kode', 'ok');
    }
    const smBlank = softmax(raw);
    write(`  Setelah softmax: ${smBlank.map(x => (x*100).toFixed(1)+'%').join(', ')}`);
    const argmax = smBlank.indexOf(Math.max(...smBlank));
    write(`  Prediksi blank : index ${argmax} = ${CLASS_LABELS_CURRENT[argmax]}`);
  } catch(e) {
    write('✗ Error blank inference: ' + e.message, 'err');
  }

  // --- STEP 3: Test dengan white input (semua 255) ---
  write('\n\n═══════════════════════════════════════════', 'info');
  write('  STEP 3 — Inference dengan White Input (semua pixel = 255)', 'info');
  write('═══════════════════════════════════════════', 'info');

  const whiteBuf = new Float32Array(3 * IMG_SIZE * IMG_SIZE);
  const mean = [0.485, 0.456, 0.406], std = [0.229, 0.224, 0.225];
  const total = IMG_SIZE * IMG_SIZE;
  for (let i = 0; i < total; i++) {
    whiteBuf[0*total+i] = (1.0 - mean[0]) / std[0];
    whiteBuf[1*total+i] = (1.0 - mean[1]) / std[1];
    whiteBuf[2*total+i] = (1.0 - mean[2]) / std[2];
  }
  const whiteTensor = new ort.Tensor('float32', whiteBuf, [1, 3, IMG_SIZE, IMG_SIZE]);
  try {
    const out = await session.run({ images: whiteTensor });
    const raw = Array.from(out['output0'].data);
    const smWhite = softmax(raw);
    write(`  Raw output    : ${raw.map(x => x.toFixed(4)).join(', ')}`);
    write(`  Setelah softmax: ${smWhite.map(x => (x*100).toFixed(1)+'%').join(', ')}`);
    const argmax = smWhite.indexOf(Math.max(...smWhite));
    write(`  Prediksi white : index ${argmax} = ${CLASS_LABELS_CURRENT[argmax]}`);
    write('  (Blank vs White berbeda? Jika ya → model responsif terhadap input ✓)');
  } catch(e) {
    write('✗ Error white inference: ' + e.message, 'err');
  }

  // --- STEP 4: Test tanpa ImageNet normalization ---
  write('\n\n═══════════════════════════════════════════', 'info');
  write('  STEP 4 — Cek Normalisasi: Tanpa ImageNet mean/std', 'info');
  write('  (beberapa model YOLO ekspor tanpa normalisasi internal)', 'info');
  write('═══════════════════════════════════════════', 'info');

  const whiteBufNoNorm = new Float32Array(3 * IMG_SIZE * IMG_SIZE).fill(1.0); // /255 only
  const whiteTensorNoNorm = new ort.Tensor('float32', whiteBufNoNorm, [1, 3, IMG_SIZE, IMG_SIZE]);
  try {
    const out = await session.run({ images: whiteTensorNoNorm });
    const raw = Array.from(out['output0'].data);
    const smNoNorm = softmax(raw);
    write(`  Raw output (tanpa ImageNet norm): ${raw.map(x => x.toFixed(4)).join(', ')}`);
    write(`  Setelah softmax: ${smNoNorm.map(x => (x*100).toFixed(1)+'%').join(', ')}`);
    const argmax = smNoNorm.indexOf(Math.max(...smNoNorm));
    write(`  Prediksi: index ${argmax} = ${CLASS_LABELS_CURRENT[argmax]}`);
  } catch(e) {
    write('✗ ' + e.message, 'err');
  }

  // --- STEP 5: Real image test if provided ---
  const imgInput = document.getElementById('imgInput');
  if (imgInput.files?.[0]) {
    write('\n\n═══════════════════════════════════════════', 'info');
    write('  STEP 5 — Gambar Nyata dari Upload', 'info');
    write('═══════════════════════════════════════════', 'info');

    const url = URL.createObjectURL(imgInput.files[0]);
    const bitmap = await createImageBitmap(await fetch(url).then(r=>r.blob()), {
      resizeWidth: IMG_SIZE, resizeHeight: IMG_SIZE, resizeQuality: 'high'
    });
    const oc = new OffscreenCanvas(IMG_SIZE, IMG_SIZE);
    const octx = oc.getContext('2d');
    octx.drawImage(bitmap, 0, 0);
    bitmap.close();
    const pixels = octx.getImageData(0, 0, IMG_SIZE, IMG_SIZE).data;

    write(`  Pixel (0,0): R=${pixels[0]} G=${pixels[1]} B=${pixels[2]}`);

    // With ImageNet norm
    const bufNorm   = makeTensorFromPixels(pixels, true);
    const bufNoNorm = makeTensorFromPixels(pixels, false);

    const t1 = new ort.Tensor('float32', bufNorm,   [1, 3, IMG_SIZE, IMG_SIZE]);
    const t2 = new ort.Tensor('float32', bufNoNorm, [1, 3, IMG_SIZE, IMG_SIZE]);

    try {
      const o1 = await session.run({ images: t1 });
      const r1 = Array.from(o1['output0'].data);
      const s1 = softmax(r1);
      const a1 = s1.indexOf(Math.max(...s1));
      write(`\n  [DENGAN ImageNet norm]`);
      write(`    Raw: ${r1.map(x=>x.toFixed(3)).join(', ')}`);
      write(`    Prob: ${s1.map(x=>(x*100).toFixed(1)+'%').join(', ')}`);
      write(`    Prediksi: index ${a1} → ${CLASS_LABELS_CURRENT[a1]}`);
    } catch(e) { write('✗ '+e.message,'err'); }

    try {
      const o2 = await session.run({ images: t2 });
      const r2 = Array.from(o2['output0'].data);
      const s2 = softmax(r2);
      const a2 = s2.indexOf(Math.max(...s2));
      write(`\n  [TANPA ImageNet norm, hanya /255]`);
      write(`    Raw: ${r2.map(x=>x.toFixed(3)).join(', ')}`);
      write(`    Prob: ${s2.map(x=>(x*100).toFixed(1)+'%').join(', ')}`);
      write(`    Prediksi: index ${a2} → ${CLASS_LABELS_CURRENT[a2]}`);
    } catch(e) { write('✗ '+e.message,'err'); }

    URL.revokeObjectURL(url);
  }

  write('\n\n═══════════════════════════════════════════', 'info');
  write('  DIAGNOSIS SELESAI', 'ok');
  write('═══════════════════════════════════════════', 'info');
}

document.getElementById('runBtn').addEventListener('click', runDiag);
</script>
</body>
</html>
